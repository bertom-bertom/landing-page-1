<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Exposition Virtuelle</title>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #0d0d0d;
            --line: #2a2a2a;
            --text: #e8e3dc;
            --muted: #7a746e;
            --accent: #c8b89a;
            --white: #f5f0e8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background: #000;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Fog ── */
        .fogwrapper {
            height: 100%;
            position: fixed;
            top: 0;
            width: 100%;

            pointer-events: none;
            z-index: 1;
            -webkit-filter: blur(1px) grayscale(0.2) saturate(1.2) sepia(0.2);
            filter: blur(1px) grayscale(0.2) saturate(1.2) sepia(0.2);
            -webkit-mask-image: linear-gradient(to right, black, transparent);
  mask-image: linear-gradient(to right, black, transparent);
        }

        #foglayer_01,
        #foglayer_02,
        #foglayer_03 {
            height: 100%;
            position: absolute;
            width: 200%;
        }

        #foglayer_01 .image01,
        #foglayer_01 .image02,
        #foglayer_02 .image01,
        #foglayer_02 .image02,
        #foglayer_03 .image01,
        #foglayer_03 .image02 {
            float: left;
            height: 100%;
            width: 50%;
        }

        #foglayer_01 {
            animation: foglayer_01_opacity 10s linear infinite, foglayer_moveme 15s linear infinite;
        }

        #foglayer_02,
        #foglayer_03 {
            animation: foglayer_02_opacity 20s linear infinite, foglayer_moveme 15s linear infinite;
        }

        #foglayer_01 .image01,
        #foglayer_01 .image02 {
            background: url("https://raw.githubusercontent.com/danielstuart14/CSS_FOG_ANIMATION/master/fog1.png") center center/cover no-repeat transparent;
        }

        #foglayer_02 .image01,
        #foglayer_02 .image02,
        #foglayer_03 .image01,
        #foglayer_03 .image02 {
            background: url("https://raw.githubusercontent.com/danielstuart14/CSS_FOG_ANIMATION/master/fog2.png") center center/cover no-repeat transparent;
        }

        @keyframes foglayer_01_opacity {
            0% {
                opacity: .08;
            }

            22% {
                opacity: .38;
            }

            40% {
                opacity: .20;
            }

            58% {
                opacity: .30;
            }

            80% {
                opacity: .12;
            }

            100% {
                opacity: .08;
            }
        }

        @keyframes foglayer_02_opacity {
            0% {
                opacity: .35;
            }

            25% {
                opacity: .14;
            }

            50% {
                opacity: .07;
            }

            80% {
                opacity: .22;
            }

            100% {
                opacity: .35;
            }
        }

        @keyframes foglayer_03_opacity {
            0% {
                opacity: .55;
            }

            27% {
                opacity: .14;
            }

            52% {
                opacity: .42;
            }

            68% {
                opacity: .20;
            }

            100% {
                opacity: .55;
            }
        }

        @keyframes foglayer_moveme {
            0% {
                left: 0;
            }

            100% {
                left: -100%;
            }
        }

        @media only screen and (min-width: 280px) and (max-width: 767px) {

            #foglayer_01 .image01,
            #foglayer_01 .image02,
            #foglayer_02 .image01,
            #foglayer_02 .image02,
            #foglayer_03 .image01,
            #foglayer_03 .image02 {
                width: 100%;
            }
        }

        /* ── Layout ── */
        nav,
        main {
            position: relative;
            z-index: 2;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 40px;
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            background: rgba(13, 13, 13, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
        }

        .nav-home {
            font-family: 'Arial', serif;
            font-size: 15px;
            font-weight: 300;
            letter-spacing: 0.14em;
            color: var(--muted);
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-home:hover {
            color: var(--accent);
        }

        .nav-home svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            flex-shrink: 0;
        }

        .nav-title {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 0.14em;
            color: var(--muted);
            text-transform: uppercase;
        }

        .nav-counter {
            font-size: 13px;
            font-weight: 300;
            color: var(--muted);
            letter-spacing: 0.08em;
            min-width: 36px;
            text-align: right;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ── Viewer ── */
        .viewer-wrapper {
            position: relative;
            flex: 1;
        }

        model-viewer {
            width: 100%;
            height: 65vh;
            min-height: 340px;
            background: transparent;
            --poster-color: transparent;
            transition: opacity 0.45s ease;
        }



        /* Loading skeleton */
        .viewer-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            
            z-index: 0;
            pointer-events: none;
        }


        /* ── Nav arrows ── */
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            background: rgba(13, 13, 13, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid var(--line);
            color: var(--muted);
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.25s, color 0.25s, background 0.25s;
            border-radius: 0;
        }

        .arrow:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(200, 184, 154, 0.08);
        }

        .arrow:active {
            transform: translateY(-50%) scale(0.95);
        }

        .arrow svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
        }

        .arrow-left {
            left: 24px;
        }

        .arrow-right {
            right: 24px;
        }

        /* ── Info strip ── */
        .info {
            padding: 28px 40px 24px;
            border-top: 1px solid var(--line);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px 40px;
            align-items: end;
            background: rgba(13, 13, 13, 0.75);
            backdrop-filter: blur(8px);
        }

        .info-label {
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
            transition: opacity 0.35s ease;
        }

        .info-title {
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 300;
            font-style: italic;
            color: var(--white);
            line-height: 1.1;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .info-meta {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.8;
            transition: opacity 0.35s ease;
        }

        .info-label.fading-text,
        .info-title.fading-text,
        .info-meta.fading-text {
            opacity: 0;
            transform: translateY(6px);
        }

        .info-label,
        .info-title,
        .info-meta {
            transform: translateY(0);
        }

        /* ── Dot indicators — diamond shape ── */
        .dots {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            padding: 16px 0 20px;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: var(--line);
            transform: rotate(45deg);
            transition: background 0.3s, transform 0.3s;
            cursor: pointer;
            border: none;
            flex-shrink: 0;
        }

        .dot:hover {
            background: var(--muted);
        }

        .dot.active {
            background: var(--accent);
            transform: rotate(45deg) scale(1.3);
        }

        /* ── Hint ── */
        .hint {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.06em;
            border-top: 1px solid var(--line);
            padding: 13px 40px;
            text-align: center;
            background: rgba(13, 13, 13, 0.75);
        }

        .hint span {
            margin: 0 8px;
        }

        /* ── Mobile ── */
        @media (max-width: 600px) {
            nav {
                padding: 16px 18px;
            }

            .nav-title {
                display: none;
            }

            .arrow {
                width: 40px;
                height: 40px;
            }

            .arrow-left {
                left: 10px;
            }

            .arrow-right {
                right: 10px;
            }

            model-viewer {
                height: 55vh;
                min-height: 280px;
            }

            .info {
                padding: 20px 18px 18px;
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .info-title {
                font-size: clamp(28px, 8vw, 38px);
            }

            .info-meta {
                font-size: 13px;
            }

            .hint {
                padding: 11px 18px;
                font-size: 11px;
            }

            .hint span {
                margin: 0 5px;
            }
        }

        @media (max-width: 380px) {
            .hint span:not(:first-child) {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Fog layers -->
    <div class="fogwrapper">
        <div id="foglayer_01">
            <div class="image01"></div>
            <div class="image02"></div>
        </div>
        <div id="foglayer_02">
            <div class="image01"></div>
            <div class="image02"></div>
        </div>
        <div id="foglayer_03">
            <div class="image01"></div>
            <div class="image02"></div>
        </div>
    </div>

    <nav>
        <a href="/" class="nav-home">
            <svg viewBox="0 0 24 24">
                <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H5a1 1 0 01-1-1V9.5z" />
                <polyline points="9 21 9 12 15 12 15 21" />
            </svg>
            Accueil
        </a>
        <span class="nav-title">Exposition Virtuelle</span>
        <span class="nav-counter" id="counter">1 / 3</span>
    </nav>

    <main>
        <div class="viewer-wrapper" id="viewerWrapper">

            <button class="arrow arrow-left" id="prevBtn" aria-label="Œuvre précédente">
                <svg viewBox="0 0 24 24">
                    <polyline points="15 18 9 12 15 6" />
                </svg>
            </button>

            <model-viewer id="modelViewer" src="./ceramic-pot.glb" alt="Modèle 3D interactif" camera-controls
                touch-action="pan-y" shadow-intensity="1" exposure="1.1" camera-orbit="0deg 75deg 2.5m"
                min-camera-orbit="auto auto 1m" max-camera-orbit="auto auto 10m" loading="eager" reveal="auto">
            </model-viewer>

            <button class="arrow arrow-right" id="nextBtn" aria-label="Œuvre suivante">
                <svg viewBox="0 0 24 24">
                    <polyline points="9 18 15 12 9 6" />
                </svg>
            </button>

        </div>

        <div class="dots" id="dots"></div>

        <div class="info">
            <div>
                <div class="info-label" id="infoNum">Pièce 01</div>
                <div class="info-title" id="infoTitle">Pot en céramique</div>
            </div>
            <div class="info-meta" id="infoMeta">
                Céramique tournée · Grès<br>
                Collection permanente
            </div>
        </div>

        <div class="hint">
            <span>Glisser pour pivoter</span>·<span>Défiler pour zoomer</span>·<span>Clic droit pour déplacer</span>
        </div>
    </main>

    <script>
        const works = [
            {
                src: './ceramic-pot.glb',
                title: 'Pot en céramique',
                num: 'Pièce 01',
                meta: 'Céramique tournée · Grès<br>Collection permanente',
            },
            {
                src: './ceramic_vase.glb',
                title: 'Vase en céramique',
                num: 'Pièce 02',
                meta: 'Faïence émaillée · Argile blanche<br>Série limitée',
            },
            {
                src: './planter_pot.glb',
                title: 'Pot de jardin',
                num: 'Pièce 03',
                meta: 'Terre cuite · Finition brute<br>Édition unique',
            },
        ];

        let current = 0;
        let transitioning = false;

        const viewer = document.getElementById('modelViewer');
        const counter = document.getElementById('counter');
        const infoTitle = document.getElementById('infoTitle');
        const infoNum = document.getElementById('infoNum');
        const infoMeta = document.getElementById('infoMeta');
        const dotsEl = document.getElementById('dots');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // Preload next model as soon as current loads
        viewer.addEventListener('load', () => {
            const next = (current + 1) % works.length;
            const link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = works[next].src;
            document.head.appendChild(link);
        });

        // Build diamond dots
        works.forEach((_, i) => {
            const d = document.createElement('button');
            d.className = 'dot' + (i === 0 ? ' active' : '');
            d.setAttribute('aria-label', `Œuvre ${i + 1}`);
            d.addEventListener('click', () => goTo(i));
            dotsEl.appendChild(d);
        });

        function updateDots() {
            dotsEl.querySelectorAll('.dot').forEach((d, i) => {
                d.classList.toggle('active', i === current);
            });
        }

        function fadeTextOut() {
            [infoNum, infoTitle, infoMeta].forEach(el => el.classList.add('fading-text'));
        }
        function fadeTextIn() {
            [infoNum, infoTitle, infoMeta].forEach(el => el.classList.remove('fading-text'));
        }

        function goTo(index) {
            if (transitioning || index === current) return;
            transitioning = true;
            current = (index + works.length) % works.length;

            // Fade out viewer + text simultaneously
            viewer.classList.add('fading');
            fadeTextOut();

            setTimeout(() => {
                const w = works[current];
                viewer.src = w.src;
                infoTitle.textContent = w.title;
                infoNum.textContent = w.num;
                infoMeta.innerHTML = w.meta;
                counter.textContent = `${current + 1} / ${works.length}`;
                updateDots();

                // Fade viewer back in immediately; text follows after tiny delay
                requestAnimationFrame(() => {
                    viewer.classList.remove('fading');
                    setTimeout(fadeTextIn, 80);
                    transitioning = false;
                });
            }, 400);
        }

        prevBtn.addEventListener('click', () => goTo(current - 1));
        nextBtn.addEventListener('click', () => goTo(current + 1));

        // Keyboard nav
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') goTo(current - 1);
            if (e.key === 'ArrowRight') goTo(current + 1);
        });

        // Swipe support
        let touchStartX = 0;
        viewer.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        viewer.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].screenX - touchStartX;
            if (Math.abs(dx) > 50) goTo(current + (dx < 0 ? 1 : -1));
        }, { passive: true });
    </script>

</body>

</html>
