<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Exposition Virtuelle</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --line: #2a2a2a;
      --text: #e8e3dc;
      --muted: #6b6560;
      --accent: #c8b89a;
      --white: #f5f0e8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav bar ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 40px;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }

    .nav-home {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-home:hover { color: var(--accent); }

    .nav-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .nav-counter {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    /* ── Main layout ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* ── Viewer area ── */
    .viewer-wrapper {
      position: relative;
      flex: 1;
    }

    model-viewer {
      width: 100%;
      height: 72vh;
      min-height: 420px;
      background: var(--surface);
      --poster-color: transparent;
    }

    /* ── Nav arrows ── */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      background: none;
      border: 1px solid var(--line);
      color: var(--muted);
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .arrow:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(200,184,154,0.06);
    }
    .arrow svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }

    .arrow-left  { left: 28px; }
    .arrow-right { right: 28px; }

    /* ── Info strip ── */
    .info {
      padding: 32px 40px 28px;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px 40px;
      align-items: end;
    }

    .info-label {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .info-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(26px, 4vw, 38px);
      font-weight: 300;
      font-style: italic;
      color: var(--white);
      line-height: 1.1;
    }

    .info-meta {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
    }

    .hint {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      border-top: 1px solid var(--line);
      padding: 14px 40px;
      text-align: center;
    }
    .hint span { margin: 0 10px; }

    /* ── Dot indicators ── */
    .dots {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      padding: 18px 0 24px;
    }
    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--line);
      transition: background 0.3s;
      cursor: pointer;
    }
    .dot.active { background: var(--accent); }

    /* ── Transition fade ── */
    .viewer-wrapper.fading model-viewer {
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    model-viewer {
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    @media (max-width: 600px) {
      nav { padding: 18px 20px; }
      .arrow-left  { left: 12px; }
      .arrow-right { right: 12px; }
      .info { padding: 24px 20px 20px; grid-template-columns: 1fr; }
      .hint { padding: 12px 20px; }
    }
  </style>
</head>

<body>

  <nav>
    <a href="#" class="nav-home">&#8617; Accueil</a>
    <span class="nav-title">Exposition Virtuelle</span>
    <span class="nav-counter" id="counter">1 / 3</span>
  </nav>

  <main>
    <div class="viewer-wrapper" id="viewerWrapper">

      <button class="arrow arrow-left" id="prevBtn" aria-label="Œuvre précédente">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <model-viewer
        id="modelViewer"
        src="./ceramic-pot.glb"
        alt="Modèle 3D interactif"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1"
        exposure="1"
        camera-orbit="0deg 75deg 2.5m"
        min-camera-orbit="auto auto 1m"
        max-camera-orbit="auto auto 10m">
      </model-viewer>

      <button class="arrow arrow-right" id="nextBtn" aria-label="Œuvre suivante">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

    </div>

    <div class="dots" id="dots"></div>

    <div class="info">
      <div>
        <div class="info-label" id="infoNum">Pièce 01</div>
        <div class="info-title" id="infoTitle">Pot en céramique</div>
      </div>
      <div class="info-meta" id="infoMeta">
        Céramique tournée · Grès<br>
        Collection permanente
      </div>
    </div>

    <div class="hint">
      <span>Glisser pour pivoter</span>·<span>Défiler pour zoomer</span>·<span>Clic droit pour déplacer</span>
    </div>
  </main>

  <script>
    const works = [
      {
        src: './ceramic-pot.glb',
        title: 'Pot en céramique',
        num: 'Pièce 01',
        meta: 'Céramique tournée · Grès<br>Collection permanente',
      },
      {
        src: './ceramic_vase.glb',
        title: 'Vase en céramique',
        num: 'Pièce 02',
        meta: 'Faïence émaillée · Argile blanche<br>Série limitée',
      },
      {
        src: './planter_pot.glb',
        title: 'Pot de jardin',
        num: 'Pièce 03',
        meta: 'Terre cuite · Finition brute<br>Édition unique',
      },
    ];

    let current = 0;

    const viewer    = document.getElementById('modelViewer');
    const wrapper   = document.getElementById('viewerWrapper');
    const counter   = document.getElementById('counter');
    const infoTitle = document.getElementById('infoTitle');
    const infoNum   = document.getElementById('infoNum');
    const infoMeta  = document.getElementById('infoMeta');
    const dotsEl    = document.getElementById('dots');
    const prevBtn   = document.getElementById('prevBtn');
    const nextBtn   = document.getElementById('nextBtn');

    // Build dots
    works.forEach((_, i) => {
      const d = document.createElement('button');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.setAttribute('aria-label', `Œuvre ${i + 1}`);
      d.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(d);
    });

    function updateDots() {
      dotsEl.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('active', i === current);
      });
    }

    function goTo(index) {
      if (index === current) return;
      current = (index + works.length) % works.length;

      wrapper.classList.add('fading');
      setTimeout(() => {
        const w = works[current];
        viewer.src = w.src;
        infoTitle.textContent = w.title;
        infoNum.textContent   = w.num;
        infoMeta.innerHTML    = w.meta;
        counter.textContent   = `${current + 1} / ${works.length}`;
        updateDots();
        wrapper.classList.remove('fading');
      }, 300);
    }

    prevBtn.addEventListener('click', () => goTo(current - 1));
    nextBtn.addEventListener('click', () => goTo(current + 1));

    // Keyboard navigation
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  goTo(current - 1);
      if (e.key === 'ArrowRight') goTo(current + 1);
    });
  </script>

</body>
</html>
