<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3D Exposition</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 20px;
    }

    .viewer {
      width: 100%;
      height: 70vh;
      min-height: 400px;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #222;
    }

    .instructions {
      padding: 20px;
      text-align: center;
      color: #aaa;
    }
  </style>
</head>

<body>

  <header>
    <h1>Exposition</h1>
  </header>

  <div class="viewer">
    <model-viewer
      src="./ceramic-pot.glb"
      alt="Interactive 3D model"

      camera-controls
      touch-action="pan-y"

      shadow-intensity="1"
      exposure="1"

      camera-orbit="0deg 75deg 2.5m"
      min-camera-orbit="auto auto 1m"
      max-camera-orbit="auto auto 10m">

    </model-viewer>
  </div>

  <div class="instructions">
    🖱️ Drag to rotate · Scroll to zoom · Right-click/trackpad to pan
  </div>

</body>
</html>
