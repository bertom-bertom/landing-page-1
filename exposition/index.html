<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Exposition Virtuelle</title>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #0d0d0d;
            --line: #2a2a2a;
            --text: #e8e3dc;
            --muted: #7a746e;
            --accent: #c8b89a;
            --white: #f5f0e8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Lock to full viewport — no scroll ever */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            /* Use dvh so mobile chrome/safari bars are included */
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ── Fog ── */
        .fogwrapper {
            height: 100%;
            position: fixed;
            top: 0;
            width: 100%;
            pointer-events: none;
            z-index: 1;
            -webkit-filter: blur(1px) grayscale(0.2) saturate(1.2) sepia(0.2);
            filter: blur(1px) grayscale(0.2) saturate(1.2) sepia(0.2);
            -webkit-mask-image: linear-gradient(to right, black, transparent);
            mask-image: linear-gradient(to right, black, transparent);
        }

        #foglayer_01,
        #foglayer_02,
        #foglayer_03 {
            height: 100%;
            position: absolute;
            width: 200%;
        }

        #foglayer_01 .image01, #foglayer_01 .image02,
        #foglayer_02 .image01, #foglayer_02 .image02,
        #foglayer_03 .image01, #foglayer_03 .image02 {
            float: left;
            height: 100%;
            width: 50%;
        }

        #foglayer_01 { animation: foglayer_01_opacity 10s linear infinite, foglayer_moveme 15s linear infinite; }
        #foglayer_02, #foglayer_03 { animation: foglayer_02_opacity 20s linear infinite, foglayer_moveme 15s linear infinite; }

        #foglayer_01 .image01, #foglayer_01 .image02 {
            background: url("https://raw.githubusercontent.com/danielstuart14/CSS_FOG_ANIMATION/master/fog1.png") center center/cover no-repeat transparent;
        }
        #foglayer_02 .image01, #foglayer_02 .image02,
        #foglayer_03 .image01, #foglayer_03 .image02 {
            background: url("https://raw.githubusercontent.com/danielstuart14/CSS_FOG_ANIMATION/master/fog2.png") center center/cover no-repeat transparent;
        }

        @keyframes foglayer_01_opacity {
            0%   { opacity: .08; } 22%  { opacity: .38; } 40%  { opacity: .20; }
            58%  { opacity: .30; } 80%  { opacity: .12; } 100% { opacity: .08; }
        }
        @keyframes foglayer_02_opacity {
            0%   { opacity: .35; } 25%  { opacity: .14; } 50%  { opacity: .07; }
            80%  { opacity: .22; } 100% { opacity: .35; }
        }
        @keyframes foglayer_03_opacity {
            0%   { opacity: .55; } 27%  { opacity: .14; } 52%  { opacity: .42; }
            68%  { opacity: .20; } 100% { opacity: .55; }
        }
        @keyframes foglayer_moveme {
            0%   { left: 0; }
            100% { left: -100%; }
        }

        @media only screen and (min-width: 280px) and (max-width: 767px) {
            #foglayer_01 .image01, #foglayer_01 .image02,
            #foglayer_02 .image01, #foglayer_02 .image02,
            #foglayer_03 .image01, #foglayer_03 .image02 { width: 100%; }
        }

        /* ── Layout — everything stacks inside the fixed body ── */
        nav, main {
            position: relative;
            z-index: 2;
        }

        nav {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 40px;
            border-bottom: 1px solid var(--line);
            background: rgba(13, 13, 13, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .nav-home {
            font-family: 'Arial', serif;
            font-size: 15px;
            font-weight: 300;
            letter-spacing: 0.14em;
            color: var(--muted);
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-home:hover { color: var(--accent); }
        .nav-home svg {
            width: 14px; height: 14px;
            stroke: currentColor; fill: none; stroke-width: 1.5; flex-shrink: 0;
        }

        .nav-title {
            font-size: 20px; font-weight: 300;
            letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase;
        }

        .nav-counter {
            font-size: 13px; font-weight: 300;
            color: var(--muted); letter-spacing: 0.08em;
            min-width: 36px; text-align: right;
        }

        /* main fills whatever space nav + hint don't take */
        main {
            flex: 1;
            min-height: 0; /* critical: allows flex child to shrink below content size */
            display: flex;
            flex-direction: column;
        }

        /* ── Viewer ── */
        .viewer-wrapper {
            position: relative;
            flex: 1;
            min-height: 0;
        }

        /* Active (visible) model-viewer */
        model-viewer#modelViewer {
            width: 100%;
            height: 100%;
            background: transparent;
            --poster-color: transparent;
            /* Fade-in: start invisible, transition to opaque when .loaded is added */
            opacity: 0;
            transition: opacity 0.55s ease;
        }

        model-viewer#modelViewer.loaded {
            opacity: 1;
        }

        /* ── Hidden preload viewers ── */
        .preload-pool {
            position: absolute;
            width: 1px; height: 1px;
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            top: 0; left: 0;
        }
        .preload-pool model-viewer {
            width: 1px; height: 1px;
        }

        /* ── Nav arrows ── */
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            background: rgba(13, 13, 13, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid var(--line);
            color: var(--muted);
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: border-color 0.25s, color 0.25s, background 0.25s;
            border-radius: 0;
        }
        .arrow:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(200, 184, 154, 0.08);
        }
        .arrow:active { transform: translateY(-50%) scale(0.95); }
        .arrow svg {
            width: 20px; height: 20px;
            stroke: currentColor; fill: none; stroke-width: 1.5;
        }
        .arrow-left  { left: 24px; }
        .arrow-right { right: 24px; }

        /* ── Info strip ── */
        .info {
            flex-shrink: 0;
            padding: 18px 40px 14px;
            border-top: 1px solid var(--line);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px 40px;
            align-items: end;
            background: rgba(13, 13, 13, 0.75);
            backdrop-filter: blur(8px);
        }

        .info-label {
            font-size: 11px; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--muted);
            margin-bottom: 5px;
            transition: opacity 0.35s ease;
        }
        .info-title {
            font-size: clamp(26px, 4vw, 42px);
            font-weight: 300; font-style: italic;
            color: var(--white); line-height: 1.1;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .info-meta {
            font-size: 13px; color: var(--muted); line-height: 1.8;
            transition: opacity 0.35s ease;
        }

        .info-label.fading-text,
        .info-title.fading-text,
        .info-meta.fading-text {
            opacity: 0; transform: translateY(6px);
        }
        .info-label, .info-title, .info-meta { transform: translateY(0); }

        /* ── Dot indicators — diamond ── */
        .dots {
            flex-shrink: 0;
            display: flex; gap: 12px; align-items: center; justify-content: center;
            padding: 10px 0 10px;
        }
        .dot {
            width: 7px; height: 7px;
            background: var(--line);
            transform: rotate(45deg);
            transition: background 0.3s, transform 0.3s;
            cursor: pointer; border: none; flex-shrink: 0;
        }
        .dot:hover { background: var(--muted); }
        .dot.active { background: var(--accent); transform: rotate(45deg) scale(1.3); }

        /* ── Hint ── */
        .hint {
            flex-shrink: 0;
            font-size: 12px; color: var(--muted); letter-spacing: 0.06em;
            border-top: 1px solid var(--line);
            padding: 10px 40px;
            text-align: center;
            background: rgba(13, 13, 13, 0.75);
        }
        .hint span { margin: 0 8px; }

        /* ── Mobile ── */
        @media (max-width: 600px) {
            nav { padding: 16px 18px; }
            .nav-title { display: none; }
            .arrow { width: 40px; height: 40px; }
            .arrow-left  { left: 10px; }
            .arrow-right { right: 10px; }
            .info {
                padding: 14px 18px 12px;
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .info-title { font-size: clamp(24px, 7vw, 34px); }
            .info-meta  { font-size: 12px; }
            .hint { padding: 9px 18px; font-size: 11px; }
            .hint span  { margin: 0 5px; }
        }

        @media (max-width: 380px) {
            .hint span:not(:first-child) { display: none; }
        }
    </style>
</head>

<body>

    <!-- Fog layers -->
    <div class="fogwrapper">
        <div id="foglayer_01"><div class="image01"></div><div class="image02"></div></div>
        <div id="foglayer_02"><div class="image01"></div><div class="image02"></div></div>
        <div id="foglayer_03"><div class="image01"></div><div class="image02"></div></div>
    </div>

    <!--
        Hidden preload pool — one model-viewer per work, all start loading immediately.
        They are invisible (opacity:0 / visibility:hidden on parent) so they consume
        no visual space and accept no pointer events, but the browser fetches and
        decodes the .glb files in the background.
    -->
    <div class="preload-pool" aria-hidden="true" id="preloadPool"></div>

    <nav>
        <a href="/" class="nav-home">
            <svg viewBox="0 0 24 24">
                <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H5a1 1 0 01-1-1V9.5z"/>
                <polyline points="9 21 9 12 15 12 15 21"/>
            </svg>
            Accueil
        </a>
        <span class="nav-title">Exposition Virtuelle</span>
        <span class="nav-counter" id="counter">1 / 4</span>
    </nav>

    <main>
        <div class="viewer-wrapper" id="viewerWrapper">

            <button class="arrow arrow-left"  id="prevBtn" aria-label="Œuvre précédente">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            </button>

            <model-viewer
                id="modelViewer"
                src="./bertom_pot.glb"
                alt="Modèle 3D interactif"
                camera-controls
                touch-action="pan-y"
                shadow-intensity="1"
                exposure="1.1"
                camera-orbit="0deg 75deg auto"
                min-camera-orbit="auto auto auto"
                max-camera-orbit="auto auto auto"
                loading="eager"
                reveal="auto">
            </model-viewer>

            <button class="arrow arrow-right" id="nextBtn" aria-label="Œuvre suivante">
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </button>

        </div>

        <div class="dots" id="dots"></div>

        <div class="info">
            <div>
                <div class="info-label" id="infoNum">Pièce 01</div>
                <div class="info-title" id="infoTitle">Pot en céramique</div>
            </div>
            <div class="info-meta" id="infoMeta">
                Céramique tournée · Grès<br>Collection permanente
            </div>
        </div>

        <div class="hint">
            <span>Glisser pour pivoter</span>·<span>Défiler pour zoomer</span>·<span>Clic droit pour déplacer</span>
        </div>
    </main>

    <script>
        const works = [
        {
                src: './bertom_pot.glb',
                title: 'Vase en céramique',
                num: 'Pièce 01',
                meta: 'Céramique tournée · Argile brune <br>Collection permanente',
            },
            {
                src: './ceramic-pot.glb',
                title: 'Pot en céramique',
                num: 'Pièce 02',
                meta: 'Céramique tournée · Grès<br>Collection permanente',
            },
            {
                src: './ceramic_vase.glb',
                title: 'Vase en céramique',
                num: 'Pièce 03',
                meta: 'Faïence émaillée · Argile blanche<br>Série limitée',
            },
            {
                src: './planter_pot.glb',
                title: 'Pot de jardin',
                num: 'Pièce 04',
                meta: 'Terre cuite · Finition brute<br>Édition unique',
            },
            
        ];

        let current = 0;
        let transitioning = false;

        const viewer    = document.getElementById('modelViewer');
        const counter   = document.getElementById('counter');
        const infoTitle = document.getElementById('infoTitle');
        const infoNum   = document.getElementById('infoNum');
        const infoMeta  = document.getElementById('infoMeta');
        const dotsEl    = document.getElementById('dots');
        const prevBtn   = document.getElementById('prevBtn');
        const nextBtn   = document.getElementById('nextBtn');
        const pool      = document.getElementById('preloadPool');

        /* ── Preload pool ──────────────────────────────────────────────────
           Spawn a hidden model-viewer for every work (except index 0 which
           is already the visible one). This forces the browser to fetch &
           parse each .glb immediately, so switching feels instant.
        ─────────────────────────────────────────────────────────────────── */
        const preloadViewers = {};
        works.forEach((w, i) => {
            if (i === 0) return; // already loaded by the main viewer
            const pv = document.createElement('model-viewer');
            pv.setAttribute('src', w.src);
            pv.setAttribute('loading', 'eager');
            pv.setAttribute('reveal', 'auto');
            // Minimal attrs — we only need the file cached, not rendered
            pool.appendChild(pv);
            preloadViewers[i] = pv;
        });

        /* ── Auto-fit camera to bounding box ──────────────────────────────
           After every model load we:
           1. Read the model's bounding box via getDimensions() → {x, y, z} in metres.
           2. Compute the spatial diagonal (the longest distance across the object).
           3. Set camera distance = diagonal × SCALE_FACTOR, which frames any model
              consistently regardless of its original units/scale in the .glb.
           4. Also clamp min/max orbit so the user can zoom but stays reasonable.
        ─────────────────────────────────────────────────────────────────── */
        const SCALE_FACTOR = 2; // tweak 1.4–2.2 to taste; 1.72 ≈ comfortable padding

        function fitCamera() {
            const dim = viewer.getDimensions();          // {x, y, z} metres
            if (!dim) return;
            const diagonal = Math.sqrt(dim.x ** 2 + dim.y ** 2 + dim.z ** 2);
            const dist     = diagonal * SCALE_FACTOR;

            // Set orbit: keep azimuth & elevation, only override radius
            viewer.cameraOrbit    = `0deg 75deg ${dist.toFixed(3)}m`;
            viewer.minCameraOrbit = `auto auto ${(dist * 0.4).toFixed(3)}m`;
            viewer.maxCameraOrbit = `auto auto ${(dist * 3.5).toFixed(3)}m`;
        }

        /* ── Fade-in on first load ─────────────────────────────────────── */
        viewer.addEventListener('load', () => {
            fitCamera();
            viewer.classList.add('loaded');
        }, { once: true });

        /* ── Build diamond dots ────────────────────────────────────────── */
        works.forEach((_, i) => {
            const d = document.createElement('button');
            d.className = 'dot' + (i === 0 ? ' active' : '');
            d.setAttribute('aria-label', `Œuvre ${i + 1}`);
            d.addEventListener('click', () => goTo(i));
            dotsEl.appendChild(d);
        });

        function updateDots() {
            dotsEl.querySelectorAll('.dot').forEach((d, i) => {
                d.classList.toggle('active', i === current);
            });
        }

        function fadeTextOut() {
            [infoNum, infoTitle, infoMeta].forEach(el => el.classList.add('fading-text'));
        }
        function fadeTextIn() {
            [infoNum, infoTitle, infoMeta].forEach(el => el.classList.remove('fading-text'));
        }

        function goTo(index) {
            if (transitioning || index === current) return;
            transitioning = true;
            current = (index + works.length) % works.length;

            // Fade out the viewer + text
            viewer.classList.remove('loaded');
            fadeTextOut();

            setTimeout(() => {
                const w = works[current];
                viewer.src = w.src;
                infoTitle.textContent = w.title;
                infoNum.textContent   = w.num;
                infoMeta.innerHTML    = w.meta;
                counter.textContent   = `${current + 1} / ${works.length}`;
                updateDots();

                // Re-apply fade-in when this model fires its load event.
                // If the file was already cached (preloaded), this fires almost immediately.
                viewer.addEventListener('load', () => {
                    fitCamera(); // auto-size before revealing
                    requestAnimationFrame(() => {
                        viewer.classList.add('loaded');
                        setTimeout(fadeTextIn, 60);
                        transitioning = false;
                    });
                }, { once: true });

                // Safety fallback: if load never fires (e.g. file missing), unblock after 2s
                setTimeout(() => {
                    if (transitioning) {
                        viewer.classList.add('loaded');
                        fadeTextIn();
                        transitioning = false;
                    }
                }, 2000);

            }, 380); // matches opacity transition on viewer
        }

        prevBtn.addEventListener('click', () => goTo(current - 1));
        nextBtn.addEventListener('click', () => goTo(current + 1));

        // Keyboard nav
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft')  goTo(current - 1);
            if (e.key === 'ArrowRight') goTo(current + 1);
        });

        
    </script>

</body>
</html>
